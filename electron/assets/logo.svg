<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Linkshelf app icon, macOS style, dark only. Source of truth: regenerate PNG/ICNS with `npm run icons`. -->
  <defs>
    <!-- Tile: dark graphite, top-lit, matching the app's dark UI -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a42"/>
      <stop offset="1" stop-color="#141417"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Book spines: lit from the left so they read as rounded -->
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a66d9"/>
      <stop offset="0.32" stop-color="#5e9bff"/>
      <stop offset="0.7" stop-color="#3f80f0"/>
      <stop offset="1" stop-color="#2459c2"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#df8d17"/>
      <stop offset="0.32" stop-color="#ffc35a"/>
      <stop offset="0.7" stop-color="#f6a935"/>
      <stop offset="1" stop-color="#cc7e12"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f9d63"/>
      <stop offset="0.32" stop-color="#4fd894"/>
      <stop offset="0.7" stop-color="#2fbf7a"/>
      <stop offset="1" stop-color="#178a55"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Shelf: brushed aluminium, top face and front face -->
    <linearGradient id="shelfTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e6ec"/>
      <stop offset="1" stop-color="#b9b9c3"/>
    </linearGradient>
    <linearGradient id="shelfFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c8c97"/>
      <stop offset="1" stop-color="#5c5c66"/>
    </linearGradient>

    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- macOS tile: 824pt body on the 1024 grid -->
  <g filter="url(#tileShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  </g>
  <g clip-path="url(#tileClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- Shadow the shelf casts on the wall -->
    <ellipse cx="512" cy="742" rx="290" ry="26" fill="#000" fill-opacity="0.55" filter="url(#softer)"/>
  </g>
  <!-- Lit top edge, like Apple's dark icons -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- Contact shadows where the books meet the shelf -->
  <g fill="#000" filter="url(#soft)">
    <ellipse cx="356" cy="664" rx="62" ry="9" fill-opacity="0.5"/>
    <ellipse cx="480" cy="664" rx="62" ry="9" fill-opacity="0.5"/>
    <ellipse cx="640" cy="664" rx="40" ry="8" fill-opacity="0.5"/>
  </g>

  <!-- Blue book: links -->
  <g>
    <rect x="300" y="318" width="112" height="344" rx="14" fill="url(#blue)"/>
    <rect x="300" y="318" width="112" height="344" rx="14" fill="url(#sheen)"/>
    <rect x="300" y="352" width="112" height="10" fill="#000" fill-opacity="0.18"/>
    <rect x="300" y="362" width="112" height="3" fill="#fff" fill-opacity="0.35"/>
    <rect x="300" y="612" width="112" height="10" fill="#000" fill-opacity="0.18"/>
    <rect x="300" y="622" width="112" height="3" fill="#fff" fill-opacity="0.35"/>
    <!-- Chain link embossed on the spine -->
    <g fill="none" stroke="#fff" stroke-opacity="0.92" stroke-width="10" stroke-linecap="round">
      <rect x="339" y="430" width="34" height="68" rx="17"/>
      <rect x="339" y="474" width="34" height="68" rx="17"/>
    </g>
  </g>

  <!-- Amber book: text snippets -->
  <g>
    <rect x="424" y="404" width="112" height="258" rx="14" fill="url(#amber)"/>
    <rect x="424" y="404" width="112" height="258" rx="14" fill="url(#sheen)"/>
    <rect x="424" y="436" width="112" height="10" fill="#000" fill-opacity="0.16"/>
    <rect x="424" y="446" width="112" height="3" fill="#fff" fill-opacity="0.4"/>
    <!-- Lines of text -->
    <g stroke="#fff" stroke-opacity="0.85" stroke-width="9" stroke-linecap="round">
      <line x1="456" y1="500" x2="504" y2="500"/>
      <line x1="456" y1="526" x2="504" y2="526"/>
      <line x1="456" y1="552" x2="488" y2="552"/>
    </g>
    <rect x="424" y="612" width="112" height="10" fill="#000" fill-opacity="0.16"/>
    <rect x="424" y="622" width="112" height="3" fill="#fff" fill-opacity="0.4"/>
  </g>

  <!-- Green book, resting on its corner and leaning on the amber one -->
  <g transform="rotate(-16 616 662)">
    <rect x="616" y="352" width="112" height="310" rx="14" fill="url(#green)"/>
    <rect x="616" y="352" width="112" height="310" rx="14" fill="url(#sheen)"/>
    <rect x="616" y="388" width="112" height="10" fill="#000" fill-opacity="0.16"/>
    <rect x="616" y="398" width="112" height="3" fill="#fff" fill-opacity="0.35"/>
    <rect x="616" y="612" width="112" height="10" fill="#000" fill-opacity="0.16"/>
    <rect x="616" y="622" width="112" height="3" fill="#fff" fill-opacity="0.35"/>
  </g>

  <!-- The shelf: front face, then top face, then a lit edge -->
  <rect x="248" y="660" width="528" height="54" rx="12" fill="url(#shelfFront)"/>
  <rect x="248" y="660" width="528" height="20" rx="10" fill="url(#shelfTop)"/>
  <rect x="258" y="661" width="508" height="2" rx="1" fill="#fff" fill-opacity="0.9"/>
  <rect x="248" y="706" width="528" height="8" rx="4" fill="#000" fill-opacity="0.08"/>
</svg>
